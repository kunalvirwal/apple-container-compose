# Directives are registered in this execution order. This deliberately small
# build contains only the directives used by coredns/Corefile.
#
# Do not add CoreDNS's ordinary cache plugin here for ACC service discovery.
# Its cache key does not include the requester's source IP or network
# membership, so it could return an address learned for another network.
errors:errors
log:log
acc:github.com/kunalvirwal/apple-container-compose/coredns/acc-plugin
forward:forward
