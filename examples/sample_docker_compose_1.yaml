name: demo
services:
  web:
    image: nginx:latest
    ports:
      - "8080:80"
    environment:
      NODE_ENV: ${FOO:-production}
  web2:
    image: my-app:latest
    build:
      context: ./examples
    volumes:
      - ./test:/app/test:rw
    ports:
      - "8081:80"
    environment:
      PORT: 80