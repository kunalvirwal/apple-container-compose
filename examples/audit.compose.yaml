name: acc-reconcile-audit
services:
  app:
    image: alpine:3.20
    command: ["sh", "-c", "while true; do echo app-ready; sleep 5; done"]
    environment:
      MODE: two
    ports:
      - "18080:8080"
    cpus: 1
    mem_limit: 256m
    networks: [front, back]
    volumes:
      - /cache
      - /scratch
      - appdata:/data
  helper:
    image: alpine:3.20
    command: ["sh", "-c", "while true; do sleep 5; done"]
    networks: [back]
networks:
  front:
  back:
volumes:
  appdata:
