# Run with: ./acc up --file ./examples/networks.compose.yaml
name: acc-networks

services:
  frontend:
    image: alpine:3.20
    command: ["sh", "-c", "while true; do echo frontend-ready; sleep 5; done"]
    networks:
      - public
    volumes:
      - /data

  backend:
    image: alpine:3.20
    command: ["sh", "-c", "while true; do echo backend-ready; sleep 5; done"]
    networks:
      - private
    volumes:
      - type: volume
        source: app-data
        target: /var/lib/app

  relay:
    image: alpine:3.20
    command: ["sh", "-c", "while true; do echo relay-ready; sleep 5; done"]
    depends_on:
      - frontend
      # - backend
    # ACC passes one --network flag for each listed network. Aliases belong
    # only to the network on which they are declared.
    networks:
      public:
        aliases:
          - public-relay
      private:
        aliases:
          - private-relay

  default-client:
    image: alpine:3.20
    command: ["sh", "-c", "while true; do echo default-client-ready; sleep 5; done"]
    # Omitting networks attaches this service only to acc-networks_default.
    # Remove this service to verify that ACC does not create a default network
    # when every service explicitly declares one or more networks.
    #
    # By default, ACC records these as forwarding nameservers for its CoreDNS
    # plugin. With --no-coredns, ACC passes them directly to this container.
    dns:
      - 1.1.1.1
      - 8.8.8.8

networks:
  # ACC creates these as acc-networks_public and acc-networks_private.
  public:
  private:

  # A pre-existing network can be attached without ACC creating or deleting it use it for networks not managed by acc:
  # shared:
  #   external: true
  #   name: existing-network

volumes:
  app-data:
